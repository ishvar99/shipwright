[project]
name = "shipwright"
version = "0.1.0"
description = "Benchmarked AI software-engineering platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    # Production, not dev: the reviewer's deterministic layer runs it over user repositories.
    # A single Rust binary with no Python dependency chain, which is what makes it affordable
    # on the 512MB host — and it already carries the flake8-bandit ruleset, so the reviewer
    # needs no separate security scanner.
    "ruff>=0.9",
]

[project.scripts]
sw = "shipwright.cli:app"

[dependency-groups]
dev = [
    "mlx-lm>=0.31",
    "pytest>=8.3",
]
evals = [
    "mini-swe-agent>=2.4",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipwright"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
